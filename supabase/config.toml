[functions.dispatch-notifications]
verify_jwt = false

[functions.parse-reminder]
verify_jwt = true

[functions.admin-dashboard]
verify_jwt = true

# Notification actions carry a short-lived, server-signed capability token so
# Android and Web system-notification buttons work even without an app session.
[functions.reminder-action]
verify_jwt = false

# AdMob calls this endpoint directly after a rewarded-ad completion. The
# function validates Google's ECDSA signature before touching any user credit.
[functions.verify-rewarded-ad]
verify_jwt = false
